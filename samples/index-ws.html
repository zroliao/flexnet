<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>

  <body>
    <p>創建 browser websocket</p>
    <script src="../dist/browser/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs/dist/protobuf.js"></script>
    <script>
      protobuf.load(["../protos/rpc.proto"], async (err, root) => {
        //
        const address = "ws://localhost:31474";
        const rpcMessage = root.lookupType("rpc.RpcMessage");

        const onopen = () => {
          console.info(`connected`);
        };

        const ondata = (data) => {
          const buffer = new Uint8Array(data);
          console.info(rpcMessage.decode(buffer));
        };

        const onclose = () => {
          console.info(`disconnect`);
        };

        const client = new flexnet.default.websocket(
          address,
          onopen,
          ondata,
          onclose
        );

        setInterval(async () => {
          const method = "a.a.a";
          const request = {
            jsonrpc: "2.0",
            msg_type: 0,
            method,
            id: "id-1",
            params: {
              type: 0,
              data: JSON.stringify({ browser: true, echo: "hello" }),
            },
          }; // 1=SerialFormat.PB_BINARY
          const message = rpcMessage.create(request);
          const payload = rpcMessage.encode(message).finish();
          client.send(payload);
        }, 2000);
      });
    </script>
  </body>
</html>
