<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>

  <body>
    <p>
      創建2個 browser datachannel
    </p>
    <script src="../dist/browser/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs/dist/protobuf.js"></script>
    <script>
      //
      protobuf.load(["../protos/rpc.proto"], async (err, root) => {
        //
        const rpcMessage = root.lookupType("rpc.RpcMessage");

        createPeerConnection(
          "pptp://browser/user/1",
          "pptp://edge-server/31474",
          "peer-browser-1"
        );

        createPeerConnection(
          "pptp://browser/user/2",
          "pptp://edge-server/31474",
          "peer-browser-2"
        );

        function createPeerConnection(
          /* @param */ peer,
          /* @param */ offer,
          /* @param */ alias
        ) {
          //
          let counter = 0;
          const defaultOption = {
            version: "0.1.0",
            username: "specific-your-username",
            password: "specific-your-password",
            peer_id: peer,
            offer_id: offer,
            signal_server: "ws://localhost:31473",
            ice_servers: [
              {
                urls: [
                  "stun:stun.l.google.com:19302",
                  "stun:stun1.l.google.com:19302",
                  "stun:stun2.l.google.com:19302",
                  "stun:stun3.l.google.com:19302",
                  "stun:stun4.l.google.com:19302",
                ],
              },
            ],
          };

          const onopen = () => {
            console.info(`[${alias}] connected`);
          };

          const ondata = (data) => {
            const buffer = new Uint8Array(data);
            console.info(`[${alias}]`, rpcMessage.decode(buffer));
          };

          const onclose = () => {
            console.info(`[${alias}] disconnect`);
          };

          const client = new flexnet.default.datachannel(
            defaultOption,
            onopen,
            ondata,
            onclose
          );

          setInterval(async () => {
            //
            const method = "a.a.a";
            const request = {
              jsonrpc: "2.0",
              msg_type: 0,
              method,
              id: `${alias}-${++counter}`,
              params: {
                type: 0,
                data: JSON.stringify({ browser: true, echo: alias }),
              },
            };

            const message = rpcMessage.create(request);
            const payload = rpcMessage.encode(message).finish();
            client.send(payload);
            //
          }, 2000);
        }
        //
      });
    </script>
  </body>
</html>
