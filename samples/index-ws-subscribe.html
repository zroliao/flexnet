<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>

  <body>
    <p>創建 browser websocket 並且 subscribe + unsubscribe</p>
    <script src="../dist/browser/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs/dist/protobuf.js"></script>
    <script>
      //
      protobuf.load(["../protos/rpc.proto"], async (err, root) => {
        //
        const address = "ws://localhost:31474";
        const rpcMessage = root.lookupType("rpc.RpcMessage");

        const onopen = () => {
          console.info(`connected`);
        };

        const ondata = (data) => {
          const buffer = new Uint8Array(data);
          console.info(rpcMessage.decode(buffer));
        };

        const onclose = () => {
          console.info(`disconnect`);
        };

        const client = new flexnet.default.websocket(
          address,
          onopen,
          ondata,
          onclose
        );

        const id = "subscribe-1";
        const subscribeDelay = 50_00;
        const unsubscribeDelay = 20_000;

        console.info(`subscribe delay: ${subscribeDelay}ms`);
        console.info(`unsubscribe delay: ${unsubscribeDelay}ms`);

        setTimeout(async () => {
          console.info("send subscribe");
          const method = "a.a.b";
          const request = {
            jsonrpc: "2.0",
            msgType: 3, // "SUBSCRIBE"
            method,
            id,
            params: {
              type: 0,
              data: JSON.stringify({ browser: true, echo: "subscribe" }),
            },
          };
          const message = rpcMessage.create(request);
          const payload = rpcMessage.encode(message).finish();
          client.send(payload);
        }, subscribeDelay);

        setTimeout(async () => {
          console.info("send subscribe");
          const method = "a.a.b";
          const request = {
            jsonrpc: "2.0",
            msgType: 4, // "UNSUBSCRIBE"
            method,
            id,
            params: {
              type: 0,
              data: JSON.stringify({ browser: true, echo: "unsubscribe" }),
            },
          };
          const message = rpcMessage.create(request);
          const payload = rpcMessage.encode(message).finish();
          client.send(payload);
        }, unsubscribeDelay);
      });
    </script>
  </body>
</html>
